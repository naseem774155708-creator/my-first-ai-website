<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نسيم تك| حلول الذكاء الاصطناعي </title>

<meta name="description"
content="حلول رقمية وذكاء اصطناعي تساعد أصحاب الأعمال على تطوير مواقعهم وخدمة عملائهم.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f7f9fc;
    color:#172033;
    line-height:1.8;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.95);
    border-bottom:1px solid #e5e7eb;
}

nav{
    max-width:1150px;
    margin:auto;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#155eef;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:#344054;
    font-weight:bold;
}

.nav-links a:hover{
    color:#155eef;
}

.hero{
    max-width:1150px;
    margin:auto;
    min-height:650px;
    padding:100px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:50px;
}
    

.hero-text{
    flex:1;
}

.badge{
    display:inline-block;
    background:#e8f0ff;
    color:#155eef;
    padding:7px 15px;
    border-radius:30px;
    margin-bottom:20px;
    font-weight:bold;
}

.hero h1{
    font-size:52px;
    line-height:1.3;
    margin-bottom:25px;
}

.hero h1 span{
    color:#155eef;
}

.hero p{
    font-size:20px;
    color:#667085;
    margin-bottom:35px;
    max-width:650px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    font-size:17px;
}

.btn-primary{
    background:#155eef;
    color:white;
}

.btn-secondary{
    background:white;
    color:#155eef;
    border:1px solid #d0d5dd;
}

.hero-card{
    flex:0 0 390px;
    background:white;
    border-radius:25px;
    padding:35px;
    box-shadow:0 15px 45px rgba(16,24,40,.12);
}

.ai-icon{
    
    width:75px;
    height:75px;
    border-radius:20px;
    background:#e8f0ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    margin-bottom:20px;
}

.hero-card h3{
    font-size:25px;
    margin-bottom:10px;
}

.hero-card p{
    color:#667085;
}

.stats{
    max-width:1000px;
    margin:-20px auto 70px;
    padding:0 20px;
}

.stats-box{
    background:#155eef;
    color:white;
    border-radius:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    padding:30px;
    text-align:center;
}

.stat h3{
    font-size:30px;
}

section{
    padding:80px 20px;
}

.section-container{
    max-width:1150px;
    margin:auto;
}

.section-title{
    text-align:center;
    margin-bottom:50px;
}

.section-title h2{
    font-size:38px;
    margin-bottom:10px;
}

.section-title p{
    
    color:#667085;
    font-size:18px;
}

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.service{
    background:white;
    padding:35px;
    border-radius:18px;
    border:1px solid #eaecf0;
    transition:.3s;
}

.service:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(16,24,40,.1);
}

.service-icon{
    font-size:38px;
    margin-bottom:15px;
}

.service h3{
    font-size:23px;
    margin-bottom:10px;
}

.service p{
    color:#667085;
}

.steps{
    background:#eef4ff;
}

.step-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.step{
    background:white;
    padding:30px;
    border-radius:18px;
}

.number{
    width:45px;
    height:45px;
    background:#155eef;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.contact-box{
